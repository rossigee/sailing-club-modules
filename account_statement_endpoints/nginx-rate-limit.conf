# Nginx rate limiting configuration for Account Statement Endpoints
# Place this in your nginx configuration file or include it

# Define rate limit zones
# 10m = 10 megabytes can track ~160,000 IP addresses
# rate=10r/s = 10 requests per second
limit_req_zone $binary_remote_addr zone=sailing_api_second:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=sailing_api_minute:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=sailing_api_hour:10m rate=500r/h;

# Optional: Different limits for different endpoints
limit_req_zone $binary_remote_addr zone=sailing_api_heavy:10m rate=2r/s;

# Rate limit status page (optional)
limit_req_status_zone;

server {
    listen 443 ssl http2;
    server_name odoo.bksc.net;
    
    # ... SSL configuration ...
    
    # Default API endpoints with standard rate limits
    location ~ ^/(bank|calendar|team)/ {
        # Apply rate limits with burst handling
        limit_req zone=sailing_api_second burst=20 nodelay;
        limit_req zone=sailing_api_minute burst=50;
        limit_req zone=sailing_api_hour burst=100;
        
        # Return friendly error for rate limit exceeded
        limit_req_status 429;
        
        # Log rate limit hits (optional)
        limit_req_log_level warn;
        
        # Proxy to Odoo
        proxy_pass http://localhost:8069;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Heavier endpoints with stricter limits
    location ~ ^/bank/statements/[^/]+/[^/]+$ {
        # Detailed statement view - stricter limits
        limit_req zone=sailing_api_heavy burst=5 nodelay;
        
        proxy_pass http://localhost:8069;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Custom error page for rate limiting
    error_page 429 @rate_limit_error;
    location @rate_limit_error {
        add_header Content-Type application/json always;
        add_header Retry-After 60 always;
        return 429 '{"status": "error", "error": "Rate limit exceeded. Please try again later."}';
    }
    
    # Optional: Whitelist certain IPs (e.g., your static website server)
    geo $whitelist {
        default 0;
        192.168.1.100 1;  # Your web server
        10.0.0.50 1;      # Your monitoring system
    }
    
    # Apply whitelist
    map $whitelist $limit_key {
        0 $binary_remote_addr;
        1 "";
    }
    
    # ... Other location blocks ...
}

# Optional: Rate limit status endpoint (for monitoring)
server {
    listen 127.0.0.1:8080;
    
    location /nginx_status {
        stub_status on;
        access_log off;
        allow 127.0.0.1;
        deny all;
    }
    
    location /req_status {
        limit_req_status_show;
        access_log off;
        allow 127.0.0.1;
        deny all;
    }
}